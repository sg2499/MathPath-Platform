<style>
:root{ color-scheme:dark; }
html,body{margin:0;padding:0;background:#02050d;}
#stage,#stage *,#stage *::before,#stage *::after{box-sizing:border-box;}
#stage{
  position:fixed; inset:0; overflow:hidden; background:#02050d;
  font-family:'Sora','Helvetica Neue',Helvetica,Arial,sans-serif;
  color:#fff; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  user-select:none; -webkit-user-select:none; cursor:default;
}
#gl{position:absolute; inset:0; width:100%; height:100%; display:block;}

/* ---- CSS-only fallback backdrop (only if WebGL init/render fails) ---- */
#fb{position:absolute; inset:0; display:none; overflow:hidden; background:#02050d;}
#fb.on{display:block;}
#fb .neb{position:absolute; inset:-25%;
  background:
    radial-gradient(38% 42% at 50% 36%, rgba(120,208,255,.26), transparent 66%),
    radial-gradient(70% 70% at 50% 46%, rgba(24,58,110,.42), transparent 74%),
    #03060f;
  filter:blur(5px);}
#fb .halo{position:absolute; left:50%; top:32%; width:38vmin; height:38vmin; margin:-19vmin 0 0 -19vmin; border-radius:50%;
  border:1px solid rgba(150,220,255,.75);
  box-shadow:0 0 40px rgba(110,200,255,.55), inset 0 0 30px rgba(110,200,255,.3);}
#fb .core{position:absolute; left:50%; top:32%; width:18vmin; height:18vmin; margin:-9vmin 0 0 -9vmin;
  background:radial-gradient(circle, #fff 0%, #cfeeff 22%, rgba(90,180,255,.45) 48%, transparent 72%); filter:blur(2px);}

/* ---- cinematic chrome ---- */
#vig{position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(126% 94% at 50% 38%, transparent 44%, rgba(2,5,13,.52) 100%),
    linear-gradient(to top, rgba(2,5,13,.92) 0%, rgba(2,5,13,.66) 12%, rgba(2,5,13,.1) 32%, transparent 48%);}
#bars{position:absolute; inset:0; pointer-events:none;}
#bars b{position:absolute; left:-2px; right:-2px; height:0; background:#000; display:block;}
#bars b.t{top:0;} #bars b.b{bottom:0;}

/* ---- typography ---- */
#ui{position:absolute; inset:0; pointer-events:none; contain:layout style;}

#tag{position:absolute; left:clamp(18px,3.4vw,54px); top:clamp(16px,3.2vh,44px);
  font-size:clamp(8px,.94vmin,12px); font-weight:600; letter-spacing:.44em; text-transform:uppercase;
  color:rgba(180,240,222,.6); opacity:0; will-change:opacity,transform;}
#tag i{display:inline-block; width:14px; height:1px; background:linear-gradient(90deg,rgba(110,230,200,.1),rgba(110,230,200,.95));
  vertical-align:middle; margin-right:10px; transform:translateY(-1px);}

/* construction annotations */
.lbl{position:absolute; left:0; top:0; font-size:clamp(9px,1.05vmin,13px); font-weight:500; letter-spacing:.14em;
  color:rgba(198,234,255,.92); opacity:0; will-change:transform,opacity; text-shadow:0 0 14px rgba(90,190,255,.85);}
#caption{position:absolute; left:0; right:0; text-align:center; top:70%;
  font-size:clamp(9px,1.12vmin,14px); font-weight:400; letter-spacing:.52em; text-transform:uppercase;
  color:rgba(186,226,255,.9); opacity:0; will-change:opacity,transform; padding-left:.52em;
  text-shadow:0 0 20px rgba(80,180,255,.6);}

#nameBlk{position:absolute; left:0; right:0; top:61%; text-align:center;
  transform-origin:50% 50%; will-change:transform; transform:translateY(-50%);}
#eyebrow{font-size:clamp(8px,.98vmin,12px); font-weight:600; letter-spacing:.58em; text-transform:uppercase;
  color:rgba(164,238,216,.9); opacity:0; margin:0 0 clamp(9px,1.5vh,19px) 0; padding-left:.58em;
  will-change:opacity,transform; text-shadow:0 0 18px rgba(60,210,175,.55);}
#name{font-family:'Cinzel','Times New Roman',serif; font-weight:600; text-transform:uppercase;
  font-size:clamp(23px,5.25vmin,68px); letter-spacing:.11em; line-height:1.02; margin:0; white-space:nowrap;}
#name span{display:inline-block; will-change:transform,opacity,filter; opacity:0;
  color:#eefff9; text-shadow:0 0 24px rgba(100,230,200,.55), 0 0 70px rgba(50,190,155,.28);}
#name span.sp{width:.34em;}

#titleBlk{position:absolute; left:0; right:0; top:79%; text-align:center;
  transform-origin:50% 50%; will-change:transform; transform:translateY(-50%);}
#rule{position:relative; height:1px; width:min(46vw,540px); margin:0 auto clamp(10px,1.7vh,21px);
  transform:scaleX(0); transform-origin:50% 50%; will-change:transform,opacity;
  background:linear-gradient(90deg, rgba(100,225,190,0) 0%, rgba(140,235,205,.8) 24%, #eafff8 50%, rgba(140,235,205,.8) 76%, rgba(100,225,190,0) 100%);
  box-shadow:0 0 14px rgba(80,215,175,.6);}
#rule::after{content:''; position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px;
  background:#ecfff8; border-radius:50%; box-shadow:0 0 12px 2px rgba(100,225,190,.9);}
#title{font-family:'Cinzel','Times New Roman',serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(20px,4.85vmin,62px); letter-spacing:.185em; line-height:1; margin:0; white-space:nowrap;
  color:#bdf5e2;
  filter:drop-shadow(0 0 22px rgba(90,220,185,.42)) drop-shadow(0 0 62px rgba(50,190,155,.2));}
#title span{display:inline-block; will-change:transform,opacity,filter; opacity:0; color:#bdf5e2;}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  #title span{
    background-image:linear-gradient(100deg,#5fa290 0%,#94d6bf 10%,#e2fff5 19%,#ffffff 25%,#b0f0d8 34%,#6fbca4 50%,#cdf7e6 70%,#8fcdb5 86%,#5fa290 100%);
    background-repeat:repeat; -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;}
}
#title span.sp{width:.3em; background-image:none;}
#sub{font-size:clamp(8px,.96vmin,12px); font-weight:500; letter-spacing:.46em; text-transform:uppercase;
  color:rgba(180,240,222,.78); margin:clamp(10px,1.7vh,21px) 0 0 0; padding-left:.46em; opacity:0;
  will-change:opacity,transform;}

/* ---- controls ---- */
#ctl{position:absolute; right:clamp(16px,2.6vw,40px); bottom:clamp(16px,2.8vh,38px);
  display:flex; gap:10px; align-items:center; pointer-events:auto; opacity:0; will-change:opacity;}
.btn{position:relative; -webkit-appearance:none; appearance:none; border:1px solid rgba(180,220,255,.22);
  background:rgba(10,20,38,.5); color:rgba(226,240,255,.9); font-family:inherit; font-size:10.5px;
  font-weight:600; letter-spacing:.2em; text-transform:uppercase; padding:11px 18px; border-radius:999px;
  cursor:pointer; overflow:hidden; backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
  transition:background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;}
.btn:hover{background:rgba(24,52,92,.65); border-color:rgba(150,210,255,.55); color:#fff; transform:translateY(-1px);}
.btn:focus-visible{outline:2px solid rgba(150,210,255,.8); outline-offset:2px;}
.btn kbd{font-family:inherit; font-size:9px; opacity:.5; margin-left:9px; letter-spacing:.12em;}
.btn .pg{position:absolute; left:0; bottom:0; height:2px; width:100%; transform:scaleX(0); transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(130,200,255,.5),#bfe4ff);}
#replayBtn{display:none;}
#replayBtn.on{display:inline-block;}

/* ---- dismissed panel ---- */
#dismissed{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#02050d;
  font-family:'Sora',Helvetica,Arial,sans-serif; z-index:5;}
#dismissed.on{display:flex;}
#dcard{text-align:center; padding:44px 52px; border:1px solid rgba(180,220,255,.14); border-radius:20px;
  background:radial-gradient(120% 140% at 50% 0%, rgba(24,58,104,.42), rgba(4,9,20,.85));
  box-shadow:0 40px 120px rgba(0,0,0,.7);}
#dcard h3{margin:0 0 6px; font-family:'Cinzel',serif; font-weight:700; font-size:19px; letter-spacing:.16em;
  text-transform:uppercase; color:#e2f0ff;}
#dcard p{margin:0 0 26px; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:rgba(214,234,255,.45);}

@media (max-height:560px){ #nameBlk{top:59%;} #titleBlk{top:81%;} #caption{top:68%;} }
</style>

<script>
(function(){
'use strict';

/* ================================================================
   MathPath — Cutscene: Specific Exam / Rank 2 — "The Proof Chain"
   Architecture: ONE requestAnimationFrame loop. Every visual, every DOM
   write and every class/attribute toggle is a pure function of
   elapsed = (performance.now() - startTime) / 1000.
   Nothing chains off transitionend / animationend / a completion promise.
   Dismissal is a boolean flag that hard-hides the stage on the same frame.
   ================================================================ */

var STUDENT   = (function(){
  try{
    var n = new URLSearchParams(location.search).get('name');
    return (n && n.trim()) ? n : 'Aditi Sharma';
  }catch(e){ return 'Aditi Sharma'; }
})();
var TITLE_TXT = 'The Proof Chain';

/* ---------------- beat sheet (seconds) ----------------
   Same construction-then-seal shape as Rank 1, retimed slightly
   tighter -- these are named steps in an argument, not a geometric
   construction, so the reveal reads as reasoning, not drafting. */
var B = {
  fadeIn:      0.26,
  barsIn:      0.12,
  spark:       0.46,
  points:      0.92,   // premise and conclusion placed
  segAB:       1.12,   // the guiding thread between them
  circA:       1.42,   // first lemma reached
  circB:       1.64,   // second lemma reached
  vesica:      2.10,   // where the lemmas meet
  tris:        2.28,   // cross-checks between every step
  circO:       2.62,   // the argument closes on itself
  hexa:        2.80,   // six checks verify the chain
  collapse:    3.22,   // the chain folds into the seal
  badge:       3.52,   // seal assembly begins
  badgeDur:    0.58,
  lock:        4.85,   // sealed + single glint
  name:        5.18,
  title:       6.45,
  idle:        8.10
};

/* ---------------- small math ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function sat(v){ return v<0?0:(v>1?1:v); }
function mix(a,b,t){ return a+(b-a)*t; }
function sstep(e0,e1,x){ var t=sat((x-e0)/(e1-e0||1e-6)); return t*t*(3-2*t); }
function outCubic(t){ var u=1-t; return 1-u*u*u; }
function outQuint(t){ var u=1-t; return 1-u*u*u*u*u; }
function outExpo(t){ return t>=1?1:1-Math.pow(2,-10*t); }
function inOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function bump(x,w){ var q=x/w; return Math.exp(-q*q); }
function pulse(x,w){ return x<=0?0:Math.exp(-x/w); }
function flick(x,w){ return x<0 ? Math.exp(-(x*x)/(w*w*0.13)) : Math.exp(-x/(w*0.9)); }
function rng(seed){ var a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------------- mat4 (column major) ---------------- */
function m4(){ return new Float32Array(16); }
function perspective(o,fovy,aspect,near,far){
  var f=1/Math.tan(fovy/2), nf=1/(near-far);
  o[0]=f/aspect;o[1]=0;o[2]=0;o[3]=0;
  o[4]=0;o[5]=f;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=(far+near)*nf;o[11]=-1;
  o[12]=0;o[13]=0;o[14]=2*far*near*nf;o[15]=0; return o;
}
function lookAt(o,ex,ey,ez,cx,cy,cz,ux,uy,uz){
  var zx=ex-cx, zy=ey-cy, zz=ez-cz, l=Math.sqrt(zx*zx+zy*zy+zz*zz)||1;
  zx/=l; zy/=l; zz/=l;
  var xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;
  l=Math.sqrt(xx*xx+xy*xy+xz*xz); if(l<1e-6){ xx=1; xy=0; xz=0; } else { xx/=l; xy/=l; xz/=l; }
  var yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
  o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
  o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[14]=-(zx*ex+zy*ey+zz*ez);
  o[15]=1; return o;
}
function mul4(o,a,b){
  for(var i=0;i<4;i++){
    var b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
    o[i*4  ]=a[0]*b0+a[4]*b1+a[8 ]*b2+a[12]*b3;
    o[i*4+1]=a[1]*b0+a[5]*b1+a[9 ]*b2+a[13]*b3;
    o[i*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    o[i*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;
  } return o;
}
/* model = T * Ry * Rx * S ; also fills rotation-only mat3 for normals */
function compose(out,n3,ry,rx,rz,s,tx,ty,tz){
  var cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),cz=Math.cos(rz),sz=Math.sin(rz);
  /* R = Rz * Ry * Rx */
  var a00=cy*cz+sy*sx*sz, a01=cx*sz, a02=-sy*cz+cy*sx*sz;
  var a10=-cy*sz+sy*sx*cz,a11=cx*cz, a12=sy*sz+cy*sx*cz;
  var a20=sy*cx,          a21=-sx,   a22=cy*cx;
  out[0]=a00*s; out[1]=a10*s; out[2]=a20*s; out[3]=0;
  out[4]=a01*s; out[5]=a11*s; out[6]=a21*s; out[7]=0;
  out[8]=a02*s; out[9]=a12*s; out[10]=a22*s; out[11]=0;
  out[12]=tx; out[13]=ty; out[14]=tz; out[15]=1;
  n3[0]=a00;n3[1]=a10;n3[2]=a20; n3[3]=a01;n3[4]=a11;n3[5]=a21; n3[6]=a02;n3[7]=a12;n3[8]=a22;
  return out;
}

/* ---------------- DOM refs ---------------- */
var $ = function(id){ return document.getElementById(id); };
var stage=$('stage'), cvs=$('gl'), fb=$('fb'), ui=$('ui'), tagEl=$('tag'), tickEl=$('ticker'),
    nameBlk=$('nameBlk'), eyebrow=$('eyebrow'), nameEl=$('name'),
    titleBlk=$('titleBlk'), ruleEl=$('rule'), titleEl=$('title'), subEl=$('sub'),
    capEl=$('caption'), lblA=$('lblA'), lblB=$('lblB'),
    barT=document.querySelector('#bars b.t'), barB=document.querySelector('#bars b.b'),
    ctl=$('ctl'), skipBtn=$('skipBtn'), replayBtn=$('replayBtn'), replayBtn2=$('replayBtn2'),
    skipPg=skipBtn.querySelector('.pg'), dismissed=$('dismissed');

/* cached style writer — avoids redundant style recalcs every frame */
var styled=[];
function sset(el,prop,val){
  var c=el.__sc; if(!c){ c=el.__sc={}; styled.push(el); }
  if(c[prop]!==val){ c[prop]=val; el.style[prop]=val; }
}
function clearStyleCache(){ for(var i=0;i<styled.length;i++) styled[i].__sc={}; }

/* ---------------- glyph spans (built once) ---------------- */
function buildGlyphs(host, text, seed){
  var r=rng(seed), out=[], i;
  host.textContent='';
  for(i=0;i<text.length;i++){
    var ch=text.charAt(i), sp=document.createElement('span');
    if(ch===' '){ sp.className='sp'; sp.innerHTML='&nbsp;'; }
    else sp.textContent=ch;
    host.appendChild(sp);
    out.push({ el:sp, i:i,
      dx:(r()*2-1)*34, dy:16+r()*16, rz:(r()*2-1)*5,
      ry:(r()*2-1)*30, sc:1.10+r()*0.16, d:r() });
  }
  return out;
}
var nameGlyphs  = buildGlyphs(nameEl, STUDENT, 5150);
var titleGlyphs = buildGlyphs(titleEl, TITLE_TXT, 8081);

/* ================= GLSL (WebGL2 / GLSL ES 3.00) ================= */
var VS_QUAD = `#version 300 es
precision highp float;
in vec2 a_pos;
out vec2 v_uv;
void main(){ v_uv = a_pos*0.5+0.5; gl_Position = vec4(a_pos,0.0,1.0); }`;

var FS_BG = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform vec2  u_res;
uniform float u_t, u_energy, u_core, u_halo, u_haloR, u_typeGlow, u_typeW;
uniform vec2  u_typeP, u_center;
float gridMask(vec2 q, float w){
  vec2 g = abs(fract(q)-0.5);
  float d = min(g.x,g.y);
  float aa = fwidth(d)*1.2 + 0.0008;
  return 1.0 - smoothstep(w, w+aa, d);
}
void main(){
  float asp = u_res.x/max(u_res.y,1.0);
  vec2 p  = (v_uv-0.5)*vec2(asp,1.0);
  vec2 pc = (v_uv-u_center)*vec2(asp,1.0);
  float r = length(pc);
  vec3 col = vec3(0.003,0.018,0.016);
  /* proof-paper: a coarse rule over a fine rule, drifting slowly */
  vec2 drift = vec2(u_t*0.0085, -u_t*0.0055);
  float fine   = gridMask(p*15.0 + drift*5.0, 0.017);
  float coarse = gridMask(p*3.0  + drift, 0.008);
  float fall = smoothstep(1.05,0.10,length(p));
  vec3 gc = vec3(0.16,0.62,0.56);
  col += gc*fine*0.0115*fall*(0.45+0.55*u_energy);
  col += gc*coarse*0.0285*fall*(0.40+0.60*u_energy);
  /* a slow horizontal survey band */
  float band = exp(-pow((p.y - sin(u_t*0.11)*0.42)*7.0,2.0));
  col += vec3(0.10,0.48,0.42)*band*0.013*(0.3+0.7*u_energy);
  /* deep cool wash */
  col += vec3(0.03,0.22,0.19)*exp(-length(p)*length(p)*1.6)*(0.055+0.135*u_energy);
  /* the light at the heart of the seal */
  col += vec3(0.30,0.90,0.78)*exp(-r*r*17.0)*u_core*0.12
       + vec3(0.72,0.98,0.92)*exp(-r*r*140.0)*u_core*0.40
       + vec3(0.94,1.00,0.98)*exp(-r*r*620.0)*u_core*1.5;
  float hd = (r-u_haloR)/0.070;
  col += vec3(0.42,0.98,0.86)*exp(-hd*hd)*u_halo*0.62;
  vec2 tp = (v_uv-u_typeP)*vec2(asp,1.0);
  float tx = tp.x/u_typeW, ty = tp.y/0.105;
  col += vec3(0.28,0.90,0.78)*exp(-tx*tx-ty*ty)*u_typeGlow*0.36;
  o = vec4(col,1.0);
}`;

var VS_RIB = `#version 300 es
precision highp float;
in vec3 a_pos; in vec2 a_uv; in vec4 a_col;
uniform mat4 u_vp;
out vec2 v_uv; out vec4 v_col;
void main(){ v_uv=a_uv; v_col=a_col; gl_Position = u_vp*vec4(a_pos,1.0); }`;

var FS_RIB = `#version 300 es
precision highp float;
in vec2 v_uv; in vec4 v_col; out vec4 o;
void main(){
  float d = clamp(1.0-abs(v_uv.y),0.0,1.0);
  float core = d*d*sqrt(d);
  float glow = pow(d,0.40);
  vec3 c = v_col.rgb*(core*1.50 + glow*0.26);
  o = vec4(c*v_col.a, 1.0);
}`;

var VS_FACET = `#version 300 es
precision highp float;
in vec3 a_final; in vec3 a_start; in vec3 a_cen; in vec3 a_nrm; in vec3 a_bary;
in vec4 a_s0;  /* delay, spin, tint, durMul */
in vec4 a_s1;  /* edgeW, layer, arc, glintBias */
uniform mat4 u_vp, u_model; uniform mat3 u_nmat;
uniform float u_ct, u_dur, u_breathe;
out vec3 v_bary, v_nrm, v_wpos; out vec4 v_s0, v_s1; out float v_flash, v_app, v_fly;
mat3 rotAxis(vec3 a, float ang){
  float c=cos(ang), s=sin(ang), t=1.0-c;
  return mat3(
    t*a.x*a.x+c,     t*a.x*a.y+s*a.z, t*a.x*a.z-s*a.y,
    t*a.x*a.y-s*a.z, t*a.y*a.y+c,     t*a.y*a.z+s*a.x,

var FS_FACET = `#version 300 es
precision highp float;
in vec3 v_bary, v_nrm, v_wpos; in vec4 v_s0, v_s1; in float v_flash, v_app, v_fly;
out vec4 o;
uniform vec3 u_eye, u_cA, u_cB, u_cEdge, u_cSpec;
uniform float u_ignite, u_glint, u_exposure;
void main(){
  vec3 N = normalize(v_nrm);

  vec3 L1 = normalize(vec3(-0.42, 0.80, 0.62));
  vec3 L2 = normalize(vec3( 0.78,-0.28, 0.40));
  vec3 L3 = normalize(vec3( 0.05,-0.90,-0.35));
  float d1 = max(dot(N,L1),0.0);
  float d2 = max(dot(N,L2),0.0);
  float d3 = max(dot(N,L3),0.0);
  float nv = max(dot(N,V),0.0);
  float fres = pow(clamp(1.0-nv,0.0,1.0),3.4);
  vec3 H1 = normalize(L1+V), H2 = normalize(L2+V);

  float sp2 = pow(max(dot(N,H2),0.0),46.0);
  vec3 base = mix(u_cA,u_cB,clamp(v_s0.z,0.0,1.0));
  vec3 col = base*(0.085 + 0.92*d1 + 0.40*d2 + 0.16*d3);
  col += u_cSpec*(sp1*1.10 + sp2*0.42);

var VS_PT = `#version 300 es
precision highp float;
in vec4 a_p;   /* xyz pos, w size */
in vec4 a_q;   /* speed, phase, tint, life */
uniform mat4 u_vp; uniform float u_t, u_amt, u_burst, u_spread; uniform vec2 u_res; uniform vec3 u_c0,u_c1;
out vec4 v_c;
void main(){
  vec3 p = a_p.xyz;

  if(u_burst > 0.5){
    /* radial ember burst driven by u_spread (seconds since impact) */
    float sp = 3.0 + a_q.x*16.0;
    float dr = 1.0-exp(-u_spread*1.5);
    p = a_p.xyz*(0.25 + dr*sp*0.42);
    p.y += dr*1.9*a_q.z - u_spread*u_spread*0.16;
    alive = exp(-u_spread*0.30)*step(0.0,u_spread);
  } else {
    float k = a_q.x;
    p.x += sin(u_t*k*0.55 + a_q.y*6.283)*0.85;
    p.z += cos(u_t*k*0.41 + a_q.y*4.712)*0.85;
    p.y = mod(p.y + u_t*(0.32+k*0.85) + a_q.y*40.0, 40.0) - 20.0;
  }
  vec4 cp = u_vp*vec4(p,1.0);
  gl_Position = cp;
  float sz = a_p.w*u_res.y*0.0011/max(cp.w,1.2);

var FS_PT = `#version 300 es
precision highp float;
in vec4 v_c; out vec4 o;
void main(){
  vec2 d = gl_PointCoord-0.5;

var FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_tex; uniform float u_th, u_knee;
void main(){
  vec3 c = texture(u_tex,v_uv).rgb;
  float l = max(c.r,max(c.g,c.b));

var FS_DOWN = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_tex; uniform vec2 u_hp;
void main(){
  vec3 s = texture(u_tex,v_uv).rgb*4.0;
  s += texture(u_tex,v_uv-u_hp).rgb;
  s += texture(u_tex,v_uv+u_hp).rgb;
  s += texture(u_tex,v_uv+vec2(u_hp.x,-u_hp.y)).rgb;
  s += texture(u_tex,v_uv-vec2(u_hp.x,-u_hp.y)).rgb;
  o = vec4(s/8.0,1.0);
}`;

var FS_UP = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_tex; uniform vec2 u_hp;
void main(){
  vec3 s = texture(u_tex,v_uv+vec2(-u_hp.x*2.0,0.0)).rgb;
  s += texture(u_tex,v_uv+vec2(-u_hp.x, u_hp.y)).rgb*2.0;
  s += texture(u_tex,v_uv+vec2(0.0, u_hp.y*2.0)).rgb;

  s += texture(u_tex,v_uv+vec2( u_hp.x,-u_hp.y)).rgb*2.0;
  s += texture(u_tex,v_uv+vec2(0.0,-u_hp.y*2.0)).rgb;

var FS_RAYS = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_tex; uniform vec2 u_c; uniform float u_density,u_decay,u_weight;
void main(){

/* --------- generic point cloud VAO --------- */

function buildPointVAO(n, burst){
  var r=rng(burst?7717:4242);

    if(burst){
      var th=r()*Math.PI*2, ph=Math.acos(2*r()-1), rr=0.6+r()*0.6;
      A[i*4  ]=Math.sin(ph)*Math.cos(th)*rr;

      A[i*4+2]=Math.sin(ph)*Math.sin(th)*rr;
      A[i*4+3]=1.0+r()*3.4;
    } else {
      A[i*4  ]=(r()*2-1)*26;
      A[i*4+1]=r()*40-20;
      A[i*4+2]=-40+r()*36;
      A[i*4+3]=0.40+r()*1.05;

/* --------- viewport / targets --------- */
function resize(force){
  var w = stage.clientWidth||window.innerWidth||1, h = stage.clientHeight||window.innerHeight||1;
  /* See the matching note in the Overall Journey scene -- the old cap
     rendered the badge below native display density on any Retina/HiDPI
     screen, then let the browser upscale it (real blur), and with no
     MSAA on the offscreen scene pass its facet edges also came out
     visibly jagged. Raised for a crisp, close-up "hero" object. */
  DPR = Math.min(window.devicePixelRatio||1, 3);
  var nw = Math.max(2, Math.round(w*DPR)), nh = Math.max(2, Math.round(h*DPR));
  var px = nw*nh, cap = 8000000;
  if(px>cap){ var s=Math.sqrt(cap/px); nw=Math.max(2,Math.round(nw*s)); nh=Math.max(2,Math.round(nh*s)); }
  if(!force && nw===RW && nh===RH) return;
  RW=nw; RH=nh; cvs.width=RW; cvs.height=RH;
  if(gl) allocTargets();
}

      var R=13.0*(1-Math.exp(-d*3.9))+0.3;
      var amp=Math.exp(-d*2.9)*(1-i*0.34)*1.05;
      ngon(84, R, 0.13*Math.exp(-d*1.7)+0.012, 0, 0.25-i*0.35, 0.72,0.90,1.0, amp);
    }
  }
  /* idle: one slow orbiting light ring, concentric with the sigil */
  if(t>B.lock-0.4){
    var lt=t-B.lock, amp2=sstep(B.lock-0.4,B.lock+1.2,t);
    for(i=0;i<2;i++){
      var rr=1.34+i*0.34, a0=lt*(0.20+i*0.07)+i*2.6;
      arc(0,S.badgeY,rr,0.011+i*0.003,a0,a0+2.6+0.4*Math.sin(lt*0.34+i),-0.55-i*0.3,
          0.62,0.86,1.0, amp2*(0.20-i*0.06), 76);
    }
  }
  worldCount=RBn-worldStart;

  /* NDC-space: a brief precision flare on the resolve, nothing more */
  ribRange(); ndcStart=RBn;
  var sAmp = 0.9*Math.exp(-Math.max(0,ac)*4.6)*(ac>0?1:0);
  if(sAmp>0.012){
    var asp=S.aspect;
    for(i=0;i<28;i++){
      var th=i/28*6.2831853+0.21, ph=sat(ac*1.9+((i*37)%13)/34);
      var r0=0.06+ph*0.95, len=0.05+ph*0.13;
      var fade=sstep(0,0.12,ph)*(1-sstep(0.72,1.0,ph))*sAmp;
      var c0=Math.cos(th),s0=Math.sin(th);
      seg2(c0*r0/asp,s0*r0, c0*(r0+len)/asp,s0*(r0+len), 0.0016+r0*0.0026, 0,
           0.80,0.93,1.0, fade*0.85);
    }
  }
  ndcCount=RBn-ndcStart;
}

/* ================= draw ================= */
function bindRT(rt){ gl.bindFramebuffer(gl.FRAMEBUFFER,rt?rt.f:null); gl.viewport(0,0,rt?rt.w:RW,rt?rt.h:RH); }
function useTex(pr,name,t,unit){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t); gl.uniform1i(pr.u[name],unit); }

function renderGL(t){
  computeState(t);
  buildRibbons(t);
  gl.bindBuffer(gl.ARRAY_BUFFER,ribBuf);
  if(RBn>0) gl.bufferSubData(gl.ARRAY_BUFFER,0,RIB.subarray(0,RBn*9));

  var msOk = !!(RT.sceneMS && RT.sceneMS.ok);
  if(msOk){ gl.bindFramebuffer(gl.FRAMEBUFFER,RT.sceneMS.f); gl.viewport(0,0,RT.sceneMS.w,RT.sceneMS.h); } else { bindRT(RT.scene); }
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  var pr=P.bg; gl.useProgram(pr.p);
  gl.uniform2f(pr.u.u_res,RT.scene.w,RT.scene.h);
  gl.uniform1f(pr.u.u_t,t);
  gl.uniform1f(pr.u.u_energy,S.energy);
  gl.uniform1f(pr.u.u_core,S.core);
  gl.uniform1f(pr.u.u_halo,S.halo);
  gl.uniform1f(pr.u.u_haloR,S.haloR);
  gl.uniform1f(pr.u.u_typeGlow,S.typeGlow);
  gl.uniform1f(pr.u.u_typeW,0.34);
  gl.uniform2f(pr.u.u_typeP,0.5,0.30);
  projectUV(0,S.badgeY,0,rayC);
  gl.uniform2f(pr.u.u_center,rayC[0],rayC[1]);
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES,0,3);

  if(t>=B.badge-0.02 && facetVAO){
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
    pr=P.facet; gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u.u_vp,false,VP);
    gl.uniformMatrix4fv(pr.u.u_model,false,MODEL);
    gl.uniformMatrix3fv(pr.u.u_nmat,false,NMAT);
    gl.uniform1f(pr.u.u_ct,t-B.badge);
    gl.uniform1f(pr.u.u_dur,B.badgeDur);
    gl.uniform1f(pr.u.u_breathe,Math.max(0,t-B.lock));
    gl.uniform3f(pr.u.u_eye,0,0,S.camZ);
    gl.uniform3f(pr.u.u_cA,0.030,0.220,0.220);
    gl.uniform3f(pr.u.u_cB,0.350,0.950,0.850);
    gl.uniform3f(pr.u.u_cEdge,0.400,1.000,0.900);
    gl.uniform3f(pr.u.u_cSpec,0.850,1.000,0.980);
    gl.uniform1f(pr.u.u_ignite,S.ignite);
    gl.uniform1f(pr.u.u_glint,S.glint);
    gl.uniform1f(pr.u.u_exposure,1.0);
    gl.bindVertexArray(facetVAO);
    gl.drawArrays(gl.TRIANGLES,0,facetCount);
  }

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false); gl.enable(gl.DEPTH_TEST);
  if(worldCount>2){
    pr=P.rib; gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u.u_vp,false,VP);
    gl.bindVertexArray(ribVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP,worldStart,worldCount);
  }
  if(ndcCount>2){
    gl.disable(gl.DEPTH_TEST);
    pr=P.rib; gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u.u_vp,false,IDENT);
    gl.bindVertexArray(ribVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP,ndcStart,ndcCount);
    gl.enable(gl.DEPTH_TEST);
  }

  pr=P.pt; gl.useProgram(pr.p);
  gl.uniformMatrix4fv(pr.u.u_vp,false,VP);
  gl.uniform2f(pr.u.u_res,RT.scene.w,RT.scene.h);
  gl.uniform1f(pr.u.u_t,t);
  gl.uniform1f(pr.u.u_burst,0);
  gl.uniform1f(pr.u.u_spread,0);
  gl.uniform1f(pr.u.u_amt, 0.14+0.20*S.energy + (t>B.lock?0.14:0));
  gl.uniform3f(pr.u.u_c0,0.34,0.62,1.00);
  gl.uniform3f(pr.u.u_c1,0.82,0.94,1.00);
  gl.bindVertexArray(moteVAO); gl.drawArrays(gl.POINTS,0,N_MOTES);
  if(S.burst>0 && S.burst<5.0){
    gl.uniform1f(pr.u.u_burst,1);
    gl.uniform1f(pr.u.u_spread,S.burst);
    gl.uniform1f(pr.u.u_amt,0.72);
    gl.uniform3f(pr.u.u_c0,0.58,0.84,1.00);
    gl.uniform3f(pr.u.u_c1,0.94,0.98,1.00);
    gl.bindVertexArray(emberVAO); gl.drawArrays(gl.POINTS,0,N_EMBERS);
  }

  /* resolve the multisampled scene into the plain texture the rest of
     the pipeline reads from -- a no-op branch when MSAA isn't available. */
  if(msOk){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,RT.sceneMS.f);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,RT.scene.f);
    gl.blitFramebuffer(0,0,RW,RH,0,0,RW,RH,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }

  /* ---------- bloom ---------- */
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.depthMask(false);
  var L=RT.lv, i;
  bindRT(L[0]); pr=P.bright; gl.useProgram(pr.p);
  useTex(pr,'u_tex',RT.scene.t,0);
  gl.uniform1f(pr.u.u_th, HDRt===gl.HALF_FLOAT?0.82:0.48);
  gl.uniform1f(pr.u.u_knee,0.40);
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES,0,3);

  pr=P.down; gl.useProgram(pr.p); gl.bindVertexArray(quadVAO);
  for(i=1;i<L.length;i++){
    bindRT(L[i]); useTex(pr,'u_tex',L[i-1].t,0);
    gl.uniform2f(pr.u.u_hp,0.5/L[i-1].w,0.5/L[i-1].h);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  pr=P.up; gl.useProgram(pr.p); gl.bindVertexArray(quadVAO);
  for(i=L.length-1;i>0;i--){
    bindRT(L[i-1]); useTex(pr,'u_tex',L[i].t,0);
    gl.uniform2f(pr.u.u_hp,0.5/L[i].w,0.5/L[i].h);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  gl.disable(gl.BLEND);

  bindRT(RT.rays); pr=P.rays; gl.useProgram(pr.p);
  useTex(pr,'u_tex',L[1].t,0);
  gl.uniform2f(pr.u.u_c, clamp(rayC[0],-0.4,1.4), clamp(rayC[1],-0.4,1.4));
  gl.uniform1f(pr.u.u_density,0.80);
  gl.uniform1f(pr.u.u_decay,0.905);
  gl.uniform1f(pr.u.u_weight,0.026);
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES,0,3);

  bindRT(null);
  pr=P.comp; gl.useProgram(pr.p);
  useTex(pr,'u_scene',RT.scene.t,0);
  useTex(pr,'u_bloom',L[0].t,1);
  useTex(pr,'u_rays',RT.rays.t,2);
  gl.uniform2f(pr.u.u_res,RW,RH);
  gl.uniform1f(pr.u.u_bloomAmt,S.bloom);
  gl.uniform1f(pr.u.u_rayAmt,S.rayAmt);
  gl.uniform1f(pr.u.u_flash,S.flash);
  gl.uniform1f(pr.u.u_ca,S.ca);
  gl.uniform1f(pr.u.u_grain,S.grain);
  gl.uniform1f(pr.u.u_vig,S.vig);
  gl.uniform1f(pr.u.u_t,t);
  gl.uniform1f(pr.u.u_exp,S.exp);
  gl.uniform1f(pr.u.u_fade,S.fade);
  gl.uniform1f(pr.u.u_sat,S.satur);
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindVertexArray(null);
}

/* ---- keep one continuous gradient across independently transformed glyphs ----
   (a parent background-clip:text is broken by transformed children, so each glyph
    carries the same gradient, offset by its own x position) */
var titleW=0;
function measureTitle(){
  try{
    var w=titleEl.getBoundingClientRect().width;
    if(!(w>4)) return;
    titleW=w;
    var sz=(w*2.35).toFixed(1)+'px 100%';
    for(var i=0;i<titleGlyphs.length;i++){
      var g=titleGlyphs[i];
      g.off=g.el.offsetLeft;
      g.el.style.backgroundSize=sz;
      if(g.el.__sc) g.el.__sc.backgroundPosition=null;
    }
  }catch(e){}
}
try{ if(document.fonts&&document.fonts.ready&&document.fonts.ready.then) document.fonts.ready.then(measureTitle); }catch(e){}
window.addEventListener('resize',function(){ measureTitle(); },{passive:true});

/* ================= DOM choreography — pure function of elapsed time ================= */
var CAPS=[[B.points-0.06,'Premise. Conclusion.'],
          [B.circA-0.06,'Two lemmas'],
          [B.vesica-0.06,'Where they meet'],
          [B.circO-0.06,'Six checks pass'],
          [B.collapse-0.18,'Chain sealed']];
var lastCap='';
function layout(t){
  var H = stage.clientHeight||window.innerHeight||800;
  var W = stage.clientWidth||window.innerWidth||1200;

  /* letterbox — deliberately slimmer than the Overall Journey scene */
  var bh = 5.5 * sat((t-B.barsIn)/0.75) * H/100;
  sset(barT,'height',bh.toFixed(1)+'px');
  sset(barB,'height',bh.toFixed(1)+'px');

  var tg = sstep(0.45,1.3,t)*0.95 * (1-sstep(B.collapse-0.5,B.collapse,t)*0.7) + sstep(B.title+0.7,B.title+1.8,t)*0.5;
  sset(tagEl,'opacity',Math.min(1,tg).toFixed(3));
  sset(tagEl,'transform','translateX('+((1-sstep(0.45,1.4,t))*-12).toFixed(1)+'px)');

  /* stepped construction caption */
  var capA = sstep(B.points-0.22,B.points+0.2,t)*(1-sstep(B.collapse-0.05,B.collapse+0.28,t));
  sset(capEl,'opacity',(capA*0.95).toFixed(3));
  sset(capEl,'transform','translateY('+((1-sstep(B.points-0.2,B.points+0.3,t))*8).toFixed(1)+'px)');
  var cap=CAPS[0][1], ci;
  for(ci=0;ci<CAPS.length;ci++){ if(t>=CAPS[ci][0]) cap=CAPS[ci][1]; }
  if(capA>0.01 && cap!==lastCap){ lastCap=cap; capEl.textContent=cap; }

  /* the two given points keep their labels while the construction stands */
  var labA = sstep(B.points+0.10,B.points+0.5,t)*(1-sstep(B.collapse-0.1,B.collapse+0.22,t));
  if(labA>0.005 && S.ptA){
    projectUV(S.ptA[0],S.ptA[1],0.02,uvA); projectUV(S.ptB[0],S.ptB[1],0.02,uvB);
    sset(lblA,'transform','translate3d('+(uvA[0]*W-26).toFixed(1)+'px,'+((1-uvA[1])*H+10).toFixed(1)+'px,0)');
    sset(lblB,'transform','translate3d('+(uvB[0]*W+16).toFixed(1)+'px,'+((1-uvB[1])*H+10).toFixed(1)+'px,0)');
  }
  sset(lblA,'opacity',labA.toFixed(3));
  sset(lblB,'opacity',labA.toFixed(3));

  /* --- name block --- */
  var solo = 1-sstep(B.title,B.title+0.75,t);
  var nScale = mix(1.0,1.135,solo), nDy = solo*0.042*H;
  sset(nameBlk,'transform','translateY(calc(-50% + '+nDy.toFixed(1)+'px)) scale('+nScale.toFixed(4)+')');

  var eb = sstep(B.name-0.36,B.name+0.24,t);
  sset(eyebrow,'opacity',(eb*0.95).toFixed(3));
  sset(eyebrow,'transform','translateY('+((1-eb)*8).toFixed(1)+'px)');
  sset(eyebrow,'letterSpacing',(0.58-0.14*(1-eb)).toFixed(3)+'em');

  var i,g,p,e,bl;
  for(i=0;i<nameGlyphs.length;i++){
    g=nameGlyphs[i];
    p=sat((t-(B.name+i*0.042))/0.60);
    if(p<=0){ sset(g.el,'opacity','0'); sset(g.el,'transform','translate3d(0,0,0)'); sset(g.el,'filter','none'); continue; }
    e=outQuint(p); var u=1-e;
    bl=u*7;
    sset(g.el,'transform','translate3d('+(g.dx*u).toFixed(2)+'px,'+(g.dy*u).toFixed(2)+'px,0) rotateY('+(g.ry*u).toFixed(2)+'deg) scale('+mix(g.sc,1,outExpo(p)).toFixed(4)+')');
    sset(g.el,'opacity',sat(p*2.4).toFixed(3));
    sset(g.el,'filter', bl>0.4 ? 'blur('+bl.toFixed(2)+'px)' : 'none');
  }

  /* --- title block --- */
  var tb=sstep(B.title-0.1,B.title+0.45,t);
  sset(titleBlk,'transform','translateY(calc(-50% + '+((1-tb)*20).toFixed(1)+'px))');
  var ru=outCubic(sat((t-B.title)/0.75));
  sset(ruleEl,'transform','scaleX('+ru.toFixed(4)+')');
  sset(ruleEl,'opacity',(ru*(0.9+0.1*Math.sin(t*1.0))).toFixed(3));

  for(i=0;i<titleGlyphs.length;i++){
    g=titleGlyphs[i];
    p=sat((t-(B.title+0.20+i*0.030))/0.55);
    if(p<=0){ sset(g.el,'opacity','0'); sset(g.el,'transform','translate3d(0,0,0)'); sset(g.el,'filter','none'); continue; }
    e=outQuint(p); var u2=1-e;
    bl=u2*6;
    sset(g.el,'transform','translate3d(0,'+(u2*22).toFixed(2)+'px,0) scale('+mix(1.14,1,outExpo(p)).toFixed(4)+')');
    sset(g.el,'opacity',sat(p*2.2).toFixed(3));
    sset(g.el,'filter', bl>0.4 ? 'blur('+bl.toFixed(2)+'px)' : 'none');
  }
  if(!titleW) measureTitle();
  if(titleW){
    var sweepPx = titleW*(1.55 - 1.95*outCubic(sat((t-B.title-0.12)/1.3)));
    if(t>B.title+1.45) sweepPx -= (t-(B.title+1.45))*titleW*0.070;
    var span=titleW*2.35;
    for(i=0;i<titleGlyphs.length;i++){
      g=titleGlyphs[i];
      var bp=(((sweepPx-(g.off||0))%span)+span)%span - span;
      sset(g.el,'backgroundPosition',bp.toFixed(1)+'px 0');
    }
  }

  var sb=sstep(B.title+0.7,B.title+1.5,t);
  sset(subEl,'opacity',(sb*0.92).toFixed(3));
  sset(subEl,'letterSpacing',(0.46-0.12*(1-sb)).toFixed(3)+'em');

  sset(ctl,'opacity',sstep(0.4,1.2,t).toFixed(3));
  sset(skipPg,'transform','scaleX('+sat(t/B.idle).toFixed(4)+')');
  var showReplay = t>=B.idle-0.05;
  if(showReplay !== replayBtn.__on){ replayBtn.__on=showReplay; replayBtn.classList.toggle('on',showReplay); }

  if(!GLOK && fbEls){
    var k=sstep(B.badge,B.lock+1.0,t);
    sset(fbEls.halo,'transform','rotate('+(t*7).toFixed(2)+'deg) scale('+(0.45+0.6*k+0.02*Math.sin(t*0.8)).toFixed(3)+')');
    sset(fbEls.halo,'opacity',(0.2+0.8*k).toFixed(3));
    sset(fbEls.core,'transform','scale('+(0.4+0.9*sstep(B.spark,B.collapse,t)+0.35*bump(t-B.collapse,0.3)+0.05*Math.sin(t*1.2)).toFixed(3)+')');
    sset(fbEls.neb,'transform','scale('+(1.05+0.04*Math.sin(t*0.21)).toFixed(3)+') translate('+(Math.sin(t*0.1)*1.0).toFixed(2)+'%,'+(Math.cos(t*0.08)*0.8).toFixed(2)+'%)');
    sset(fb,'opacity',sat(t/0.6).toFixed(3));
  }
}

/* ================= fallback (no WebGL) ================= */
var fbEls=null;
function useFallback(){
  if(fbEls) return;
  fbEls={ neb:fb.querySelector('.neb'), halo:fb.querySelector('.halo'), core:fb.querySelector('.core') };
  fb.classList.add('on');
  cvs.style.display='none';
}
function fallbackRender(){ /* all fallback motion happens in layout() */ }

/* ================= loop + controls ================= */
var startTime=null, rafId=0, ended=false;
var reduced = false;
try{ reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

function frame(now){
  rafId=0;
  if(ended) return;                       /* boolean flag: hard stop, no tween awaited */
  /* Anchor the timeline to the FIRST actually-rendered frame, not to the
     moment start() was called -- see the matching note in the Overall
     Journey scene. Fixes the cutscene showing only the settled end state
     when the preview iframe takes a beat to become visible. */
  if(startTime===null) startTime=now;
  /* Play the full sequence regardless of prefers-reduced-motion -- this is a
     one-time, several-second award reveal being actively reviewed/approved,
     not persistent ambient motion, so skipping straight to the end state
     (the previous behavior) defeated the entire point of previewing it.
     Vestibular-relevant effects (screen shake, flash/chromatic-aberration
     pulses) are still dialed down below via reducedAmp -- respected in
     spirit without hiding the cutscene itself. */
  var t = (now-startTime)/1000;
  if(!(t>=0)) t=0;
  if(t>B.idle+7200) t=B.idle+7200;
  try{
    if(GLOK) renderGL(t); else fallbackRender(t);
  }catch(err){
    if(GLOK){ GLOK=false; glErr=String((err&&err.message)||err); try{ useFallback(); }catch(e2){} }
  }
  try{ layout(t); }catch(err2){}
  if(!audioArmed && t>=AUDIO_TRIGGER){ audioArmed=true; tryStartAudio(); }
  if(!ended) rafId=requestAnimationFrame(frame);
}

function start(){
  ended=false;
  dismissed.classList.remove('on');
  stage.style.display='';
  clearStyleCache();
  lastCap='';
  replayBtn.__on=undefined;
  if(GLOK){ try{ resize(false); }catch(e){} }
  startTime = null;   /* re-armed; frame() anchors it to the next real paint */
  stopAudio();
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(frame);
}
function endNow(){
  if(ended) return;
  ended = true;                            /* the flag every path reads */
  if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
  stage.style.display='none';              /* instant — no transition involved */
  stopAudio();
  dismissed.classList.add('on');
  try{ parent.postMessage({ type: 'mathpath-cutscene-ended' }, '*'); }catch(e){}
}

skipBtn.addEventListener('click',function(ev){ ev.preventDefault(); endNow(); });
replayBtn.addEventListener('click',function(ev){ ev.preventDefault(); start(); });
replayBtn2.addEventListener('click',function(ev){ ev.preventDefault(); start(); });
window.addEventListener('keydown',function(ev){
  var k=ev.key;
  if(k==='Escape'||k==='s'||k==='S'||k==='Enter'||k===' '){ ev.preventDefault(); endNow(); }
  else if(k==='r'||k==='R'){ start(); }
});
window.addEventListener('resize',function(){ if(GLOK){ try{ resize(false); }catch(e){} } },{passive:true});
cvs.addEventListener('webglcontextlost',function(ev){ ev.preventDefault(); GLOK=false; try{ useFallback(); }catch(e){} },false);

/* ================= audio: one pre-trimmed loop, WebAudio =================
   Decoded once at boot; playback starts the first time the timeline
   crosses AUDIO_TRIGGER (armed) AND the buffer has finished decoding
   (ready) AND a user gesture has unlocked the AudioContext where the
   browser requires one -- whichever of those three finishes last is
   what actually starts sound, via tryStartAudio() being called from
   every one of those three places. Nothing here can throw into the

var actx=null, abuf=null, asrc=null, again=null, audioReady=false, audioArmed=false, audioStarted=false;
function primeAudio(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    actx = new Ctx();
    var raw = atob(AUDIO_B64);
    var buf = new ArrayBuffer(raw.length), view = new Uint8Array(buf);
    for(var i=0;i<raw.length;i++) view[i]=raw.charCodeAt(i);
