<style>
:root{ color-scheme:dark; --display:'Unbounded'; --body:'Sora'; --ink:#f0f8ff; --accent:#8fd2ff; --glow:rgba(60,160,255,.6); --glow2:rgba(120,90,255,.3); --kick:rgba(214,236,255,.9); --t0:#ffffff; --t1:#bfe4ff; --t2:#3f8fe0; --subc:rgba(214,236,255,.86); --linec:#eef7ff; --titleLs:.03em; --titleW:900; }
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;color:#fff;font-family:var(--body),'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;}
#ui{position:absolute;inset:0;pointer-events:none;}
#bars b{position:absolute;left:0;right:0;height:var(--lb,8vh);background:#000;display:block;}
#bars b.t{top:0;} #bars b.b{bottom:0;}
#kicker{position:absolute;left:16px;right:16px;top:calc(var(--lb,8vh) + 2.4vh + env(safe-area-inset-top,0px));text-align:center;
  font-weight:700;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;white-space:nowrap;color:#fff;color:color-mix(in srgb,var(--accent) 30%,#fff);opacity:0;
  text-shadow:0 1px 1px #000,0 0 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.75),0 0 28px rgba(0,0,0,.5);}

#col::before{content:'';position:absolute;left:-14%;right:-14%;top:-22%;bottom:-30%;z-index:-1;pointer-events:none;opacity:var(--scrim,0);

.ln{display:block;width:100%;line-height:1.08;visibility:hidden;}
.ln .in{display:inline-block;}
.ln.wrap .in{display:inline;text-wrap:balance;}
.ln .w{display:inline-block;white-space:nowrap;}
.ln .g{display:inline-block;opacity:0;will-change:opacity,transform,filter;}

.ln-name{font-family:var(--display),serif;font-weight:var(--nameW,700);letter-spacing:var(--nameLs,.06em);color:var(--ink);text-transform:var(--nameCase,none);

<script>
/* MathPath scenes v3 -- math and procedural geometry.
   Every mesh is built here at load time from code (no model files), with
   flat normals where an object is cut (crests, gems, badges) so the facets
   stay crisp, and smooth normals where it is turned (rings, pedestals). */
var MPG = (function(){
"use strict";

G.scale3 = function(c,k){ return [c[0]*k,c[1]*k,c[2]*k]; };

/* ---------------- vectors / matrices (column-major) ---------------- */

  add:function(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];},

  mul:function(a,k){return [a[0]*k,a[1]*k,a[2]*k];},
  dot:function(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];},
  cross:function(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];},
  len:function(a){return Math.hypot(a[0],a[1],a[2]);},
  norm:function(a){var l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},

  o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
  o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d; return o; };
/* quaternion helpers [x,y,z,w] */
G.q = {
  axis:function(ax,ang){ ax=G.v3.norm(ax); var s=Math.sin(ang/2); return [ax[0]*s,ax[1]*s,ax[2]*s,Math.cos(ang/2)]; },
  mul:function(a,b){ return [a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1], a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0], a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3], a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]]; },
  euler:function(x,y,z){ return G.q.mul(G.q.mul(G.q.axis([0,1,0],y),G.q.axis([1,0,0],x)),G.q.axis([0,0,1],z)); },
  slerp:function(a,b,t){ var c=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3]; if(c<0){ b=[-b[0],-b[1],-b[2],-b[3]]; c=-c; }
    if(c>0.9995){ var r=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,a[3]+(b[3]-a[3])*t]; var l=Math.hypot(r[0],r[1],r[2],r[3]); return [r[0]/l,r[1]/l,r[2]/l,r[3]/l]; }
    var th=Math.acos(c), s=Math.sin(th), wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s; return [a[0]*wa+b[0]*wb,a[1]*wa+b[1]*wb,a[2]*wa+b[2]*wb,a[3]*wa+b[3]*wb]; },
  rot:function(q,v){ var u=[q[0],q[1],q[2]], s=q[3]; var t=G.v3.mul(G.v3.cross(u,v),2); return G.v3.add(G.v3.add(v,G.v3.mul(t,s)),G.v3.cross(u,t)); }
};
M4.trs = function(o,p,q,s){ var x=q[0],y=q[1],z=q[2],w=q[3]; var sx=s[0],sy=s[1],sz=s[2];

  o[4]=2*(x*y-z*w)*sy; o[5]=(1-2*(x*x+z*z))*sy; o[6]=2*(y*z+x*w)*sy; o[7]=0;
  o[8]=2*(x*z+y*w)*sz; o[9]=2*(y*z-x*w)*sz; o[10]=(1-2*(x*x+y*y))*sz; o[11]=0;
  o[12]=p[0]; o[13]=p[1]; o[14]=p[2]; o[15]=1; return o; };
G.project = function(vp,p,out){ var x=p[0],y=p[1],z=p[2]; var w=vp[3]*x+vp[7]*y+vp[11]*z+vp[15]; if(Math.abs(w)<1e-5) w=1e-5;
  out[0]=((vp[0]*x+vp[4]*y+vp[8]*z+vp[12])/w)*0.5+0.5; out[1]=((vp[1]*x+vp[5]*y+vp[9]*z+vp[13])/w)*0.5+0.5; out[2]=w; return out; };

Geo.prototype.tri = function(a,b,c,e,flatN){
  var n = flatN || G.v3.norm(G.v3.cross(G.v3.sub(b,a),G.v3.sub(c,a)));
  this.v(a,n,e); this.v(b,n,e); this.v(c,n,e); return this; };
Geo.prototype.v = function(p,n,e,seed){ this.pos.push(p[0],p[1],p[2]); this.nrm.push(n[0],n[1],n[2]); this.aux.push(e||0,seed==null?0.5:seed,0,0); this.ctr.push(0,0,0,0); };
Geo.prototype.quad = function(a,b,c,d,e){ this.tri(a,b,c,e); this.tri(a,c,d,e); return this; };
/* transform in place (mat4) */
Geo.prototype.xform = function(m){
  for(var i=0;i<this.pos.length;i+=3){ var x=this.pos[i],y=this.pos[i+1],z=this.pos[i+2];
    this.pos[i]=m[0]*x+m[4]*y+m[8]*z+m[12]; this.pos[i+1]=m[1]*x+m[5]*y+m[9]*z+m[13]; this.pos[i+2]=m[2]*x+m[6]*y+m[10]*z+m[14];
    x=this.nrm[i];y=this.nrm[i+1];z=this.nrm[i+2];
    var nx=m[0]*x+m[4]*y+m[8]*z, ny=m[1]*x+m[5]*y+m[9]*z, nz=m[2]*x+m[6]*y+m[10]*z, l=Math.hypot(nx,ny,nz)||1;
    this.nrm[i]=nx/l; this.nrm[i+1]=ny/l; this.nrm[i+2]=nz/l; }
  for(i=0;i<this.ctr.length;i+=4){ x=this.ctr[i];y=this.ctr[i+1];z=this.ctr[i+2];
    this.ctr[i]=m[0]*x+m[4]*y+m[8]*z+m[12]; this.ctr[i+1]=m[1]*x+m[5]*y+m[9]*z+m[13]; this.ctr[i+2]=m[2]*x+m[6]*y+m[10]*z+m[14]; }
  return this; };

  M4.trs(m,[x||0,y||0,z||0],G.q.euler(rx||0,ry||0,rz||0),typeof sc==='number'?[sc,sc,sc]:sc); return this.xform(m); };

Geo.prototype.emit = function(e){ for(var i=0;i<this.aux.length;i+=4) this.aux[i]=e; return this; };

/* the whole geo is one assembly piece (its own centre, given order) */
Geo.prototype.piece = function(order){
  var c=[0,0,0], n=this.pos.length/3; for(var i=0;i<this.pos.length;i+=3){ c[0]+=this.pos[i]; c[1]+=this.pos[i+1]; c[2]+=this.pos[i+2]; }

  for(i=0;i<this.ctr.length;i+=4){ this.ctr[i]=c[0]; this.ctr[i+1]=c[1]; this.ctr[i+2]=c[2]; this.ctr[i+3]=order; }
  return this; };

  electric: { intro: 3, spans: [2, 2, 2, 2], keys: [45, 43, 40, 41],

function scoreAccuracy(A, sc) {

var $=function(id){ return document.getElementById(id); };
var stage=$('stage'), cvs=$('gl');
var reduced=false; try{ reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
var ctx={ E:E, G:G, K:K, name:NAME, level:LEVEL, reduced:reduced, t:0, dt:0 };
if(SC.prepare) SC.prepare(ctx, qs);
ctx.acc = isNaN(ACC) ? (SC.defaultAcc||90) : ACC;

/* ======================= text ======================= */
var T=SC.text||{}, CUE=SC.cues||{}, REV=SC.reveal||{};
function words(id){ var v=T[id]; return typeof v==='function'? v(ctx) : v; }
var col=$('col'), kick=$('kicker');
var ELS={};
var ORDER = SC.order || (SC.kind==='podium' ? ['eyebrow','name','rule','title','sub'] : ['title','readout','line']);
var SIZES = Object.assign(SC.kind==='podium'
  ? { eyebrow:[1.8,12], name:[7.2,15], title:[8.4,17], sub:[1.7,12], kicker:[1.6,11] }
  : { title:[12.5,22], readout:[8.5,20], cap:[2.0,13], line:[2.4,15], kicker:[1.6,11] }, SC.sizes||{});
['eyebrow','sub','cap','line','kicker'].forEach(function(k){ var d={eyebrow:[1.8,12],sub:[1.7,12],cap:[2.0,13],line:[2.4,15],kicker:[1.6,11]}[k]; if(SIZES[k]){ SIZES[k]=[Math.max(SIZES[k][0],d[0]),Math.max(SIZES[k][1],d[1])]; } });
function glyphs(el, text){ el.innerHTML=''; var inner=document.createElement('span'); inner.className='in';
  var parts=String(text).split(' ');
  parts.forEach(function(w,wi){ var wd=document.createElement('span'); wd.className='w';
    for(var i=0;i<w.length;i++){ var g=document.createElement('span'); g.className='g'; g.textContent=w[i]; wd.appendChild(g); }
    inner.appendChild(wd); if(wi<parts.length-1){ inner.appendChild(document.createTextNode(' ')); } });
  el.appendChild(inner); el._g=[].slice.call(inner.querySelectorAll('.g')); el._in=inner; return el; }
ORDER.forEach(function(id){ var el=document.createElement('div'); el.id=id; el.className='ln ln-'+id; col.appendChild(el); ELS[id]=el;
  if(id==='rule') return;
  if(id==='readout'){ el.innerHTML='<span class="in"><span id="pct"></span><span id="cap"></span></span>'; el._in=el.firstChild; return; }
  var w=words(id); if(id==='name') w=NAME; if(w==null||w===''){ el.style.display='none'; return; } glyphs(el,w); });
if(ELS.readout){ glyphs($('cap'), words('cap')||''); }
var kickText = typeof T.kicker==='function' ? null : (T.kicker||'');
if(kickText!==null) kick.textContent=kickText;

function setFont(el, px){ el.style.fontSize=px.toFixed(2)+'px'; }
function fitAll(){
  var vw=window.innerWidth, vh=window.innerHeight, vmin=Math.min(vw,vh), maxW=Math.max(120, Math.min(vw-32, vw*0.92));
  var area=(SC.area||(SC.kind==='podium'?0.44:0.42))*vh;
  var scale=1;
  for(var pass=0;pass<6;pass++){
    ORDER.forEach(function(id){ var el=ELS[id]; if(!el||id==='rule'||el.style.display==='none') return;
      var sz=SIZES[id]||[2,10], px=Math.max(sz[1], sz[0]*vmin/100*scale*(vh<500&&vw>vh?0.85:1));
      el.style.whiteSpace='nowrap'; el.classList.remove('wrap'); setFont(el,px);
      if(id==='readout'){ var cs=SIZES.cap||[1.5,10]; setFont($('cap'), Math.max(cs[1], cs[0]*vmin/100*scale)); }
      var w=el._in.offsetWidth;
      if(w>maxW){ px=Math.max(sz[1], px*maxW/w*0.97); setFont(el,px); w=el._in.offsetWidth; }
      if(w>maxW){ el.style.whiteSpace='normal'; el.classList.add('wrap'); }
    });
    var kw=SIZES.kicker; setFont(kick, Math.max(kw[1], kw[0]*vmin/100));
    if(kick.scrollWidth>maxW){ kick.style.whiteSpace='normal'; }
    if(col.offsetHeight<=area || scale<0.45) break;
    scale*=Math.max(0.6, area/col.offsetHeight*0.98);
  }
  col.style.maxWidth=maxW+'px';
  /* free band for the hero: below the letterbox and status line, above the text */
  var lbpx=0.032*vh, r=col.getBoundingClientRect(), kb=kick.getBoundingClientRect();
  var top=lbpx+0.035*vh;
  var bot=r.top-0.025*vh; if(bot-top<0.2*vh) bot=top+0.2*vh;
  K.box=[top/vh, bot/vh];
}
/* reveal styles: (local progress e in 0..1, glyph index i) -> css */
var STYLE={
  rise:function(e){ return [e, (1-e)*0.38, (1-e)*6, 1]; },
  drop:function(e){ return [e, -(1-e)*0.42, (1-e)*5, 1]; },
  focus:function(e){ return [e, 0, (1-e)*16, 1]; },
  flare:function(e){ return [Math.min(1,e*1.6), 0, (1-e)*4, 1+3.5*(1-e)]; },
  flicker:function(e,i){ if(e>=1) return [1,0,0,1]; var f=Math.sin(e*40+i*7.3)>0.2?1:0.12; return [e*f, 0, 0, 1+(1-e)]; },
  type:function(e){ return [e>0?1:0, 0, 0, e>0&&e<0.4?2.2:1]; },
  alt:function(e,i){ return [e, (i%2?-1:1)*(1-e)*0.36, (1-e)*4, 1]; },
  settle:function(e){ return [e, -(1-e)*0.12, (1-e)*9, 1+(1-e)]; },
  ember:function(e,i){ return [e, (1-e)*0.18, (1-e)*3, 1+2.5*Math.max(0,1-e*1.4)]; }
};
var SCR='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function reveal(el, t, at, style, dur, stag){ if(!el||!el._g||el.style.display==='none') return;
  var gs=el._g, f=STYLE[style]||STYLE.rise; dur=dur||0.55; stag=stag==null?0.04:stag;
  var vis = t>=at-0.01; el.style.visibility = vis?'visible':'hidden';
  for(var i=0;i<gs.length;i++){ var e=G.oCub((t-at-i*stag)/dur), r=f(e,i), g=gs[i];
    var k=r[0].toFixed(3)+'|'+r[1].toFixed(3)+'|'+r[2].toFixed(2)+'|'+r[3].toFixed(2);
    if(g._k===k) continue; g._k=k;
    g.style.opacity=r[0]; g.style.transform='translateY('+r[1].toFixed(3)+'em)';
    g.style.filter=(r[2]>0.05?'blur('+r[2].toFixed(2)+'px) ':'')+(r[3]>1.01?'brightness('+r[3].toFixed(2)+')':'');
    if(style==='decode'){ if(e<1 && e>0){ g.textContent=SCR[Math.floor(Math.abs(Math.sin(t*30+i*13))*SCR.length)%SCR.length]; } else if(g._orig) g.textContent=g._orig; }
  } }
function opacityAt(t,at,d){ return G.sstep(at,at+(d||0.6),t); }
function updText(t){
  var c=CUE;
  if(typeof T.kicker==='function'){ var kt=T.kicker(ctx,t); if(kick._t!==kt){ kick._t=kt; kick.textContent=kt; } }
  kick.style.opacity = c.kicker==null?0 : (opacityAt(t,c.kicker[0],0.8)*(c.kicker[1]!=null?1-G.sstep(c.kicker[1],c.kicker[1]+0.8,t)*(c.kicker[2]==null?0.6:c.kicker[2]):1)).toFixed(3);
  ['eyebrow','name','title','sub','line'].forEach(function(id){ if(ELS[id]&&c[id]!=null) reveal(ELS[id], t, c[id], (REV[id]||{}).s||({eyebrow:'focus',name:'rise',title:'rise',sub:'focus',line:'rise'})[id], (REV[id]||{}).d, (REV[id]||{}).g); });
  if(ELS.rule && c.rule!=null){ var e=G.oExpo((t-c.rule)/0.9); ELS.rule.style.transform='scaleX('+Math.max(0,e).toFixed(3)+')'; ELS.rule.style.opacity=e>0?1:0; }
  if(ELS.readout && c.readout!=null){ var p=G.oCub((t-c.readout)/(SC.countDur||1.0)); var el=$('pct');
    var txt=Math.round(ctx.acc*Math.max(0,p))+'%'; if(el._t!==txt){ el._t=txt; el.textContent=txt; }
    ELS.readout.style.opacity=G.sstep(c.readout,c.readout+0.3,t); reveal($('cap'), t, c.readout+0.35, 'focus', 0.5, 0.02); }
  var c0=Infinity; ['eyebrow','name','title','sub','line','readout'].forEach(function(id){ if(ELS[id]&&c[id]!=null&&c[id]<c0) c0=c[id]; });
  var sc=(c0<Infinity? G.sstep(c0-0.35,c0+0.45,t):0).toFixed(3); if(col._sc!==sc){ col._sc=sc; col.style.setProperty('--scrim',sc); }
  if(SC.textFx) SC.textFx(ctx, t, ELS);
  if(SC.kind!=='podium'){ var fo=(1-G.sstep(SC.dur-0.6,SC.dur-0.05,t)).toFixed(3); if(col._o!==fo){ col._o=fo; col.style.opacity=fo; kick.style.opacity=Math.min(+kick.style.opacity||0,+fo); } }
}

/* ======================= controls ======================= */
var skipBtn=$('skipBtn'), replayBtn=$('replayBtn'), dismissed=$('dismissed');
var ended=false, raf=0, start=null, lastT=0, perfN=0, perfS=[], perfLast=0;
function post(type){ try{ parent.postMessage({type:type},'*'); }catch(e){} }
function endNow(){ if(ended) return; ended=true; if(raf){ cancelAnimationFrame(raf); raf=0; } stage.style.display='none'; dismissed.classList.add('on'); stopAudio(); post('mathpath-cutscene-ended'); }
skipBtn.addEventListener('click',function(e){ e.preventDefault(); endNow(); });
replayBtn.addEventListener('click',function(e){ e.preventDefault(); restart(); });
window.addEventListener('keydown',function(e){ var k=e.key; if(k==='Escape'||k==='Enter'||k===' '||k==='s'||k==='S'){ e.preventDefault(); endNow(); } else if((k==='r'||k==='R')&&replayBtn.classList.contains('on')){ e.preventDefault(); restart(); } });
function restart(){ ended=false; stage.style.display=''; dismissed.classList.remove('on'); start=null; replayBtn.classList.remove('on'); stopAudio(); armed=true; startAudio(); if(raf) cancelAnimationFrame(raf); raf=requestAnimationFrame(frame); }

/* ======================= sound ======================= */
var actx=null, abuf=null, asrc=null, again=null, armed=true, playing=false, synth=null, hintEl=null, hintTimer=null;
function getCtx(){ if(actx) return actx; var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ actx=new C(); }catch(e){ actx=null; } return actx; }
function loadTrack(){ if(typeof AUDIO_B64==='undefined' || !getCtx()) return;
  try{ var raw=atob(AUDIO_B64), buf=new ArrayBuffer(raw.length), v=new Uint8Array(buf); for(var i=0;i<raw.length;i++) v[i]=raw.charCodeAt(i);
    actx.decodeAudioData(buf,function(d){ abuf=d; startAudio(); },function(){}); }catch(e){} }
function startAudio(){
  if(!armed||playing||!getCtx()) return;
  if(actx.state==='suspended'){ try{ actx.resume(); }catch(e){} }
  if(SC.kind==='podium'){
    if(!abuf) return;
    try{ asrc=actx.createBufferSource(); asrc.buffer=abuf; asrc.loop=true; again=actx.createGain(); again.gain.value=0;
      asrc.connect(again); again.connect(actx.destination); asrc.start(0); again.gain.linearRampToValueAtTime(0.85, actx.currentTime+1.4); playing=true; }catch(e){}
  } else {
    if(actx.state!=='running') return;
    try{ synth=new MPAudio(actx); synth.start(0.85); var el=start===null?0:Math.max(0,(performance.now()-start)/1000);
      if(el<SC.dur-0.6) scoreAccuracy(synth,{ impactAt:SC.beats.impact, dur:SC.dur, elapsed:el, sound:SC.sound, index:SC.index||0 }); playing=true; }catch(e){}
  }
  if(playing) hideHint();
}
function stopAudio(){ armed=false; hideHint();
  if(again&&actx){ try{ var n=actx.currentTime; again.gain.cancelScheduledValues(n); again.gain.setValueAtTime(again.gain.value,n); again.gain.linearRampToValueAtTime(0,n+0.5); }catch(e){} }
  if(asrc){ try{ asrc.stop(actx.currentTime+0.55); }catch(e){} asrc=null; }
  if(synth){ try{ synth.stop(0.3); }catch(e){} synth=null; }
  playing=false; }
function unlock(){ if(actx&&actx.state==='suspended'){ try{ var p=actx.resume(); if(p&&p.then) p.then(startAudio).catch(function(){}); }catch(e){} } startAudio(); }
['pointerdown','pointerup','mousedown','click','touchstart','touchend','keydown'].forEach(function(ev){
  try{ document.addEventListener(ev,unlock,{capture:true,passive:true}); }catch(e){} });
function showHint(){ if(playing||hintEl||ended) return; hintEl=document.createElement('div'); hintEl.className='hint'; hintEl.setAttribute('role','button');
  hintEl.textContent='🔊 Tap for sound'; hintEl.addEventListener('pointerdown',function(e){ e.stopPropagation(); unlock(); }); document.body.appendChild(hintEl); }
function hideHint(){ if(hintTimer){ clearTimeout(hintTimer); hintTimer=null; } if(hintEl){ hintEl.remove(); hintEl=null; } }
hintTimer=setTimeout(showHint,650);

/* ======================= loop ======================= */
var bars=$('bars');
function frame(now){
  if(start===null) start=now;
  var t=Math.max(0,(now-start)/1000); if(t>86400) t=86400;
  var dt=Math.min(0.1,Math.max(0,t-lastT)); lastT=t; ctx.t=t; ctx.dt=dt;
  /* adaptive quality: judge the real frame rate over the first frames */
  if(perfN<200 && !navigator.webdriver){ var real=now-(perfLast||now); perfLast=now; if(real>0&&real<500){ perfS.push(real); perfN++; }
    if(perfS.length>=30){ perfS.sort(function(a,b){return a-b;}); var med=perfS[15]; perfS=[]; if(med>38 && E.degrade()) perfN=Math.max(perfN,0); else perfN=200; } }
  try{ E.resize(false); E.begin(t); SC.frame(ctx); E.render(); }
  catch(err){ if(!E._failed){ E._failed=true; try{ console.error(err); }catch(_){} document.body.classList.add('nogl'); } }
  updText(t);
  skipBtn.classList.toggle('on', t>0.5);
  var lb=1-G.sstep(0,1.2,t); stage.style.setProperty('--lb',(3.2+5*lb).toFixed(2)+'vh');
  if(SC.kind==='podium'){ var showR=t>=SC.beats.idle; if(showR!==replayBtn._on){ replayBtn._on=showR; replayBtn.classList.toggle('on',showR); } }
  else if(t>=SC.dur){ endNow(); return; }
  if(!ended) raf=requestAnimationFrame(frame);
}
function boot(){
  try{ E.init(cvs); if(SC.init) SC.init(ctx); }
  catch(err){ try{ console.error(err); }catch(_){} throw err; }
  fitAll(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll); setTimeout(fitAll,1200);
  window.addEventListener('resize',function(){ fitAll(); E.resize(true); });
  [].slice.call(document.querySelectorAll('.g')).forEach(function(g){ g._orig=g.textContent; });
  if(SC.kind==='podium') loadTrack(); else startAudio();
  raf=requestAnimationFrame(frame);
}
window.__mp={ ctx:ctx, fit:fitAll, els:ELS };
boot();
})();

</script>
